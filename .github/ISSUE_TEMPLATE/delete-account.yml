name: NOOR-E-ZARR deletion request
description: Request deletion assistance without posting private business information.
title: "[Deletion request] "
labels: ["deletion-request"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post an email address, customer name, phone number, invoice, token, or ledger data. The developer operates no ledger server; this request provides deletion guidance and confirmation.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am requesting NOOR-E-ZARR account/data deletion assistance.
          required: true
        - label: I have not included private business or Google account data.
          required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: State only whether you need phone, Google Drive, export-file, or access-revocation guidance.
      placeholder: I need deletion guidance for...
    validations:
      required: true
